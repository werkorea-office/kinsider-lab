name: Social publishing

on:
  schedule:
    # 23:00 KST = 9:00 AM US Eastern. GitHub delays busy on-the-hour schedules (sometimes by hours),
    # so several off-peak triggers fire; the publish ledgers make every run after the first a no-op.
    - cron: '53 13 * * *'
    - cron: '11 14 * * *'
    - cron: '37 14 * * *'
    - cron: '17 15 * * *'
    - cron: '0 3 * * 1'   # Mondays 12:00 KST: extend the Instagram token
  workflow_dispatch:
    inputs:
      task:
        description: "publish, refresh, check, linkedin or dryrun"
        default: publish

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow==12.* pynacl==1.*

      - name: Refresh token (weekly)
        if: github.event.schedule == '0 3 * * 1' || inputs.task == 'refresh'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          python -m pipeline.social_instagram refresh

      - name: Check secrets-updater token
        if: inputs.task == 'check'
        env:
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python -m pipeline.social_instagram check

      - name: Publish today's card
        if: (github.event_name == 'schedule' && github.event.schedule != '0 3 * * 1') || inputs.task == 'publish'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m pipeline.social_instagram publish

      - name: Publish today's carousel to LinkedIn
        if: always() && ((github.event_name == 'schedule' && github.event.schedule != '0 3 * * 1') || inputs.task == 'publish' || inputs.task == 'linkedin')
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python -m pipeline.social_linkedin publish

      - name: Dry run (upload without posting)
        if: inputs.task == 'dryrun'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python -m pipeline.social_instagram dryrun
          python -m pipeline.social_linkedin dryrun

      - name: Asset ledger (visitors, subscribers, followers)
        if: always() && ((github.event_name == 'schedule' && github.event.schedule != '0 3 * * 1') || inputs.task == 'publish')
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python -m pipeline.assets

      - name: Save posting ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/social data/assets.csv 2>/dev/null || git add data/social || true
          if git diff --staged --quiet; then echo "No ledger change."; else
            git commit -m "Social ledger $(TZ=Asia/Seoul date +%F) [skip ci]"
            git pull --rebase origin main && git push
          fi
