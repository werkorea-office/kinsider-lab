name: Social publishing

on:
  schedule:
    # Target 23:00 KST (14:00 UTC) = 9:00 AM US Eastern. GitHub can delay schedules by hours, so
    # early triggers start a runner that waits until 23:00 KST, and late ones are backups. Runs are
    # serialized (concurrency) and the publish ledgers make every run after the first a no-op.
    - cron: '7 10 * * *'
    - cron: '41 11 * * *'
    - cron: '23 12 * * *'
    - cron: '53 13 * * *'
    - cron: '11 14 * * *'
    - cron: '37 14 * * *'
    - cron: '17 15 * * *'
    - cron: '0 3 * * 1'   # Mondays 12:00 KST: extend the Instagram token
  workflow_dispatch:
    inputs:
      task:
        description: "publish, refresh, check, linkedin or dryrun"
        default: publish

permissions:
  contents: write
  actions: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait until 23:00 KST (scheduled posting runs only)
        if: github.event_name == 'schedule' && github.event.schedule != '0 3 * * 1'
        run: |
          h=$(date -u +%H)
          if [ "$h" -lt 9 ] || [ "$h" -ge 17 ]; then
            # Outside 18:00-02:00 KST: a badly delayed trigger. Never post at the wrong time of day.
            echo "Outside the posting window; not posting now."; echo "SOCIAL_SKIP=1" >> "$GITHUB_ENV"
            # Make sure tonight's relay is running (extra starter besides the morning data run).
            GH_TOKEN="${{ github.token }}" gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/relay.yml/dispatches" -f ref=main || true
          else
            wait=$(( $(date -u -d "$(date -u +%F) 14:00" +%s) - $(date -u +%s) ))
            if [ $wait -gt 0 ]; then echo "Waiting $wait s until 23:00 KST"; sleep $wait; fi
          fi
          git pull -q origin main   # pick up a post made by an earlier run while we waited

      - name: Install dependencies
        run: pip install pillow==12.* pynacl==1.*

      - name: Refresh token (weekly)
        if: github.event.schedule == '0 3 * * 1' || inputs.task == 'refresh'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          python -m pipeline.social_instagram refresh

      - name: Check secrets-updater token
        if: inputs.task == 'check'
        env:
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python -m pipeline.social_instagram check

      - name: Publish today's card
        if: env.SOCIAL_SKIP != '1' && ((github.event_name == 'schedule' && github.event.schedule != '0 3 * * 1') || inputs.task == 'publish')
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m pipeline.social_instagram publish

      - name: Publish today's carousel to LinkedIn
        if: always() && env.SOCIAL_SKIP != '1' && ((github.event_name == 'schedule' && github.event.schedule != '0 3 * * 1') || inputs.task == 'publish' || inputs.task == 'linkedin')
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python -m pipeline.social_linkedin publish

      - name: Dry run (upload without posting)
        if: inputs.task == 'dryrun'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python -m pipeline.social_instagram dryrun
          python -m pipeline.social_linkedin dryrun

      - name: Asset ledger (visitors, subscribers, followers)
        if: always() && ((github.event_name == 'schedule' && github.event.schedule != '0 3 * * 1') || inputs.task == 'publish')
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python -m pipeline.assets

      - name: Save posting ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/social data/assets.csv 2>/dev/null || git add data/social || true
          if git diff --staged --quiet; then echo "No ledger change."; else
            git commit -m "Social ledger $(TZ=Asia/Seoul date +%F) [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done
          fi
