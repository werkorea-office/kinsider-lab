name: Social publishing

on:
  schedule:
    - cron: '0 14 * * *'  # 23:00 KST = 9:00 AM US Eastern (EST) / 10:00 AM (EDT): post today's card
    - cron: '0 3 * * 1'   # Mondays 12:00 KST: extend the Instagram token
  workflow_dispatch:
    inputs:
      task:
        description: "publish, refresh or check"
        default: publish

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh token (weekly)
        if: github.event.schedule == '0 3 * * 1' || inputs.task == 'refresh'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          pip install pynacl==1.*
          python -m pipeline.social_instagram refresh

      - name: Check secrets-updater token
        if: inputs.task == 'check'
        env:
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python -m pipeline.social_instagram check

      - name: Publish today's card
        if: github.event.schedule == '0 14 * * *' || inputs.task == 'publish'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m pipeline.social_instagram publish

      - name: Save posting ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/social || true
          if git diff --staged --quiet; then echo "No ledger change."; else
            git commit -m "Social ledger $(TZ=Asia/Seoul date +%F) [skip ci]"
            git pull --rebase origin main && git push
          fi
