name: Daily Korea demand brief

on:
  schedule:
    - cron: '30 21 * * *'   # 06:30 KST every day (Naver data for the previous day is complete by then)
  workflow_dispatch:
    inputs:
      force_report:
        description: "Build the monthly report now (yes/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image library
        run: pip install pillow==12.* reportlab==5.*

      - name: Self-test (blocks publishing if the pipeline is broken)
        run: python -m unittest discover -s tests -v

      - name: Collect data from Naver DataLab
        env:
          NAVER_HUB_KEY_ID: ${{ secrets.NAVER_HUB_KEY_ID }}
          NAVER_HUB_KEY: ${{ secrets.NAVER_HUB_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m pipeline.collect

      - name: Build site
        run: python -m pipeline.build

      - name: Make social card
        run: python -m pipeline.cards

      - name: Monthly report (1st of the month)
        run: |
          if [ "${{ inputs.force_report }}" = "yes" ]; then python -m pipeline.report --force; else python -m pipeline.report; fi
          python -m pipeline.build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data index.html archive.html methodology.html 404.html feed.xml sitemap.xml robots.txt brief cards term signals.html reports.html reports
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily brief $(TZ=Asia/Seoul date +%F) [skip ci]"
            git push
          fi
