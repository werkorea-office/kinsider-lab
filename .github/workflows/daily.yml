name: Daily Korea demand brief

on:
  schedule:
    - cron: '30 21 * * *'   # 06:30 KST every day (Naver data for the previous day is complete by then)
  workflow_dispatch:
    inputs:
      force_report:
        description: "Build the monthly report now (yes/no)"
        default: "no"
      newsletter:
        description: "Weekly email: 'auto' (Mondays), 'draft' (test draft in Kit) or 'status' (list health)"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image library
        run: pip install pillow==12.* reportlab==5.*

      - name: Self-test (blocks publishing if the pipeline is broken)
        run: python -m unittest discover -s tests -v

      - name: Collect data from Naver DataLab
        env:
          NAVER_HUB_KEY_ID: ${{ secrets.NAVER_HUB_KEY_ID }}
          NAVER_HUB_KEY: ${{ secrets.NAVER_HUB_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m pipeline.collect

      - name: Korea Customs export statistics (weekly)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m pipeline.exports || echo "Export statistics unavailable today; site keeps last verified figures."

      - name: Build site
        run: python -m pipeline.build

      - name: Make social card
        run: python -m pipeline.cards

      - name: Weekly email brief (Mondays; 'draft' input makes a test draft in Kit)
        id: newsletter
        continue-on-error: true   # never blocks publishing the day's data; reported at the end
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: |
          case "${{ inputs.newsletter }}" in
            draft) python -m pipeline.newsletter --draft ;;
            status) python -m pipeline.newsletter --status ;;
            *) python -m pipeline.newsletter ;;
          esac

      - name: Monthly report (1st of the month)
        run: |
          if [ "${{ inputs.force_report }}" = "yes" ]; then python -m pipeline.report --force; else python -m pipeline.report; fi
          python -m pipeline.build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data index.html archive.html methodology.html 404.html feed.xml sitemap.xml robots.txt brief cards term signals.html reports.html reports exports.html newsletter
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily brief $(TZ=Asia/Seoul date +%F) [skip ci]"
            git push
          fi

      - name: Fail visibly if the weekly email could not be scheduled
        if: steps.newsletter.outcome == 'failure'
        run: |
          echo "Weekly email brief failed; the site and data were still published. See the step log above."
          exit 1
